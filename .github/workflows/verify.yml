name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.13
          cache: true
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Canary server links bbolt only
        run: |
          deps="$(go list -deps -f '{{.ImportPath}}' ./cmd/server)"
          printf '%s\n' "$deps" | grep -E 'modernc.org/sqlite|github.com/go-sql-driver/mysql|github.com/jackc/pgx' && exit 1 || true
          printf '%s\n' "$deps" | grep -q 'go.etcd.io/bbolt'
