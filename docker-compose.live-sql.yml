name: headless-backend-live-sql

# Ephemeral databases for make live-sql. Empty/trust auth is test-only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: headless
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d headless"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:9
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: headless
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:12
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: headless
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
